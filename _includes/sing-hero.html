{%- comment -%} Home SING heading art: two AI chiplets on a glass panel, linked through photonic engines (PIC) by SiN waveguides. Pulses run both ways and the receiving chip lights up on arrival; CSS only (asdl.css "SING heading art"). {%- endcomment -%}
<svg class="sing-hero" viewBox="0 0 420 250" role="img" aria-labelledby="sh-title sh-desc">
  <title id="sh-title">AI chiplets linked by light on a glass panel</title>
  <desc id="sh-desc">Concept top view: two AI chiplets sit on a shared glass packaging panel, each next to a photonic engine. Three SiN waveguides on the glass carry light between the engines in both directions, and the receiving chiplet lights up when a pulse arrives.</desc>
  <defs>
    <linearGradient id="sh-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3d5a"/><stop offset="1" stop-color="#0f2233"/>
    </linearGradient>
    <linearGradient id="sh-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bff3ff" stop-opacity="0"/><stop offset=".5" stop-color="#bff3ff" stop-opacity=".16"/><stop offset="1" stop-color="#bff3ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sh-tgv" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.1"/></pattern>
    <clipPath id="sh-clip"><rect x="20" y="34" width="380" height="190" rx="18"/></clipPath>
    <filter id="sh-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="sh-route-a" d="M146 112H170Q184 112 184 98V86Q184 72 198 72H222Q236 72 236 86V98Q236 112 250 112H274" pathLength="100"/>
    <path id="sh-route-b" d="M146 125H274" pathLength="100"/>
    <path id="sh-route-c" d="M146 138H170Q184 138 184 152V164Q184 178 198 178H222Q236 178 236 164V152Q236 138 250 138H274" pathLength="100"/>
  </defs>

  <rect x="20" y="34" width="380" height="190" rx="18" fill="url(#sh-glass)" class="sh-edge"/>
  <g clip-path="url(#sh-clip)">
    <rect x="20" y="34" width="380" height="190" fill="url(#sh-tgv)" class="sh-tgv"/>
    <rect x="-80" y="0" width="70" height="260" fill="url(#sh-sheen)" class="sh-sheen" transform="skewX(-20)"/>
  </g>
  <rect x="28" y="42" width="364" height="174" rx="13" fill="none" class="sh-edge" opacity=".35"/>
  <text x="40" y="210" class="sh-label">GLASS PANEL</text>
  <text x="210" y="210" class="sh-label" text-anchor="middle">SiN waveguide</text>

  <g class="sh-lane">
    <use href="#sh-route-a" class="sh-violet"/>
    <use href="#sh-route-b"/>
    <use href="#sh-route-c"/>
  </g>
  <g class="sh-pulse" filter="url(#sh-glow)">
    <use href="#sh-route-a" class="p-a"/><use href="#sh-route-b" class="p-b"/><use href="#sh-route-c" class="p-c"/>
  </g>
  <g class="sh-pulse core">
    <use href="#sh-route-a" class="p-a"/><use href="#sh-route-b" class="p-b"/><use href="#sh-route-c" class="p-c"/>
  </g>

  <path d="M110 114H128M110 125H128M110 136H128M292 114H310M292 125H310M292 136H310" class="sh-wire"/>
  <rect x="44" y="88" width="72" height="74" rx="11" class="sh-halo h-l" filter="url(#sh-glow)"/>
  <rect x="304" y="88" width="72" height="74" rx="11" class="sh-halo h-r" filter="url(#sh-glow)"/>
  <rect x="50" y="94" width="60" height="62" rx="8" class="sh-chip"/>
  <rect x="310" y="94" width="60" height="62" rx="8" class="sh-chip"/>
  <rect x="128" y="102" width="18" height="46" rx="4" class="sh-pic"/>
  <rect x="274" y="102" width="18" height="46" rx="4" class="sh-pic"/>
  <text x="80" y="131" class="sh-ai">AI</text>
  <text x="340" y="131" class="sh-ai">AI</text>
  <text x="137" y="94" class="sh-label" text-anchor="middle">PIC</text>
  <text x="283" y="94" class="sh-label" text-anchor="middle">PIC</text>
</svg>
