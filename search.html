---
layout: default
title: Search
eyebrow: Search
permalink: /search/
---

<div class="kw-search">
  <label for="search-input" class="sr-only">Search the site</label>
  <input type="text" id="search-input" placeholder="Search news, papers, people…" autocomplete="off">
  <ul id="results-container"></ul>
</div>

<script src="{{ '/dest/jekyll-search.js' | relative_url }}"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: '{{ "/search2.json" | relative_url }}',
    searchResultTemplate: '<li><a href="{url}" title="{desc}">{title}</a></li>',
    noResultsText: 'No results found',
    limit: 10,
    fuzzy: false,
    exclude: ['Welcome']
  });
</script>
